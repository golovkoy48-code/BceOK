.sm{font-size:.76rem;color:var(--mu);text-align:center}
.m{cursor:pointer}.mu{opacity:.38}
.sw{animation:sw calc(var(--b,.55s)*2) ease-in-out infinite}
.cr{animation:cb var(--b,.55s) ease-in-out infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:spin calc(var(--b,.55s)*2) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bm{animation:bm calc(var(--b,.55s)*4) ease-in-out infinite}
svg:not(.on) *{animation-play-state:paused}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
