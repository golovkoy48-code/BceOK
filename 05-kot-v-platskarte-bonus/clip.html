<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кот уехал в плацкарте · AI Band (Скелетик)</title>
  <!-- Подключение Tailwind CSS для адаптивного UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Подключение Three.js (r128) и OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Шрифт Inter и акцентный моноширинный шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Контейнер вьюпорта с поддержкой 16:9 и 9:16 */
    #viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #18181b 0%, #050507 100%);
    }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      box-shadow: 0 0 60px rgba(239, 68, 68, 0.18);
    }
    #canvas-container.portrait-mode {
      width: min(92vw, calc(92vh * 9 / 16));
      height: min(92vh, calc(92vw * 16 / 9));
      border-radius: 24px;
      border: 2px solid rgba(244, 63, 94, 0.45);
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    /* Кастомные слайдеры */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.12);
      height: 6px;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f43f5e;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
    }
    /* Пульсация индикатора записи */
    @keyframes recPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.2); }
    }
    .rec-dot {
      animation: recPulse 1s infinite ease-in-out;
    }
    /* Эффект виньетки и хроматической окантовки */
    .cinema-vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 58%, rgba(0, 0, 0, 0.72) 100%);
    }
  </style>
</head>
<body>
  <div id="viewport-wrapper">
    <div id="canvas-container">
      <!-- Three.js рендер-контейнер -->
      <div id="three-root" class="w-full h-full"></div>
      <div class="cinema-vignette"></div>

      <!-- Верхняя панель HUD: Заголовок, BPM, Секция и Кнопка записи -->

      <!-- Блок живых субтитров и текущего солиста -->

        </div>
        <div id="subtitle-box" class="max-w-2xl text-center bg-zinc-950/75 backdrop-blur-md border border-zinc-800/80 rounded-2xl px-4 py-2.5 shadow-2xl transition-all duration-200">

            <button data-soloist="NVIDIA" class="solo-btn px-2 py-1.5 rounded-lg text-[10px] font-mono-tech font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition">NVIDIA</button>

      <!-- Всплывающее системное уведомление (без alert) -->
      <div id="toast-msg" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-zinc-900/95 border border-rose-500/50 text-white px-4 py-2 rounded-xl text-xs font-mono-tech shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">

  <script>
    /**
     * ============================================================================
     * 1. ТАЙМИНГ-МАНИФЕСТ ТРЕКА (AUDIO-BLINDNESS BYPASS CONTRACT)
     * Жесткая сетка 136 BPM, размер 4/4, длительность 70.58 секунд (40 тактов).
     * ============================================================================
     */
    const BPM = 136;
    const BEAT_DURATION = 60 / BPM; // ~0.44117 сек на долю
    const BAR_DURATION = BEAT_DURATION * 4; // ~1.7647 сек на такт
    const TOTAL_BARS = 40;
    const TOTAL_DURATION = TOTAL_BARS * BAR_DURATION; // ~70.59 сек

    // Карта персонажей-рокеров (6 участников группы в плацкарте)
    const BAND_MEMBERS = [
      { id: 'LOCAL',      name: 'LOCAL (Кот-Фронтмен)',    color: 0xf43f5e, hex: '#f43f5e', role: 'Экстрим-вокал и лидер-гитара', pos: [0, 0, -1.2],   rotY: 0 },
      { id: 'GEMINI',     name: 'GEMINI (Соло-Гитар)',     color: 0x38bdf8, hex: '#38bdf8', role: 'Неоновые запилы на верхней полке', pos: [-1.45, 1.15, -2.6], rotY: 0.45 },
      { id: 'GROQ',       name: 'GROQ (Ультра-Бас)',       color: 0xf97316, hex: '#f97316', role: 'Сверхбыстрый слэп-бас', pos: [1.45, 0, -2.5],     rotY: -0.45 },
      { id: 'OPENROUTER', name: 'OPENROUTER (Ритм-Рифф)',  color: 0xa855f7, hex: '#a855f7', role: 'Кросс-маршрутизация дисторшна', pos: [-1.45, 0, -4.4],    rotY: 0.35 },
      { id: 'CLAUDE',     name: 'CLAUDE (Акустика & Лирика)', color: 0xfbbf24, hex: '#fbbf24', role: 'Балладный бридж и подстаканник', pos: [1.45, 1.15, -4.4],  rotY: -0.35 },
      { id: 'NVIDIA',     name: 'NVIDIA (Тензор-Ударные)', color: 0x22c55e, hex: '#22c55e', role: 'Кардан на 136 BPM с трассировкой', pos: [0, 0.15, -6.0],     rotY: 0 }
    ];

    // Таймлайн секций, субтитров и автоматического переключения солистов
    const TIMELINE_SECTIONS = [
      {
        startBar: 0, endBar: 4,
        label: 'INTRO // РАЗГОН СОСТАВА',
        soloist: 'NVIDIA',
        camPreset: 'WIDE_CARRIAGE',
        lyricMain: 'Ту-дух, ту-дух! Рельсы искрят под 136 BPM!',
        lyricSub: '[Вступление: ударная установка NVIDIA задает темп плацкарта]'
      },
      {
        startBar: 4, endBar: 12,
        label: 'КУПЛЕТ 1 // БИЛЕТ В ОДИН КОНЕЦ',
        soloist: 'LOCAL',
        camPreset: 'FRONTMAN_LOW',
        lyricMain: 'Кот взял билет на боковушку у туалета — и врубил перегруз!',
        lyricSub: 'В подстаканнике кипит энергетик, за окном мелькает ночной блюз!'
      },
      {
        startBar: 12, endBar: 20,
        label: 'ПРИПЕВ 1 // КОТ УЕХАЛ В ПЛАЦКАРТЕ!',
        soloist: 'GEMINI',
        camPreset: 'TOP_BUNK_ACTION',
        lyricMain: 'КОТ УЕХАЛ В ПЛАЦКАРТЕ! РВЁТ СТРУНЫ НА ВЕРХНЕЙ ПОЛКЕ!',
        lyricSub: 'Вагон качает в такт риффам — проводница в полном восторге!'
      },
      {
        startBar: 20, endBar: 28,
        label: 'КУПЛЕТ 2 // РОК-КОНЦЕРТ В ВАГОНЕ №7',
        soloist: 'GROQ',
        camPreset: 'BASS_GROOVE',
        lyricMain: 'Бас качает так, что с полки падает варёное яйцо и курица гриль!',
        lyricSub: 'Маршрутизатор OpenRouter раздаёт дисторшн на весь ночной штиль!'
      },
      {
        startBar: 28, endBar: 34,
        label: 'ГИТАРНОЕ СОЛО // ШРЕД В ТАМБУРЕ',
        soloist: 'OPENROUTER',
        camPreset: 'ORBIT_SOLO',
        lyricMain: '⚡ БЕЗУМНОЕ СОЛО НА ЭЛЕКТРОГИТАРЕ ПОСРЕДИ НОЧНОГО ПЕРЕГОНА! ⚡',
        lyricSub: '[Синхронизация стробоскопов и искр за окном вагона]'
      },
      {
        startBar: 34, endBar: 40,
        label: 'ФИНАЛ // ПОЛНЫЙ ХОД',
        soloist: 'CLAUDE',
        camPreset: 'FINALE_SWEEP',
        lyricMain: 'Кот уехал в плацкарте — и этот поезд уже не остановить!',
        lyricSub: 'Финальный аккорд! Все 6 участников на сцене вагона.'
      }
    ];

    /**
     * ============================================================================
     * 2. ДВУХКАНАЛЬНЫЙ РОК-АУДИОДВИЖОК (WEB AUDIO API + ПОДДЕРЖКА СВОЕГО MP3/WAV)
     * Канал А: Вокал / Формантный Лид (или загруженный пользователем аудиофайл)
     * Канал Б: Процедурный Рок-Инструментал (Overdrive Guitar + Bass + Drums)
     * ============================================================================
     */
    class RockAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.startTime = 0;
        this.pauseOffset = 0;
        this.schedulerTimer = null;
        this.nextStepTime = 0;
        this.currentStep = 0; // 16-е доли (4 шага на удар, 16 шагов на такт)

        // Шины микшера
        this.vocalGain = null;
        this.musicGain = null;
        this.masterGain = null;
        this.analyser = null;
        this.freqData = null;

        // Внешний загруженный вокальный трек
        this.customAudioBuffer = null;
        this.customBufferSource = null;
        this.isCustomVocalActive = false;

        // Для записи видео+аудио в WebM
        this.mediaStreamDest = null;

        // Кривая дисторшна для рок-гитары
        this.distortionCurve = this.makeDistortionCurve(240);
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.9;

        this.vocalGain = this.ctx.createGain();
        this.vocalGain.gain.value = parseFloat(document.getElementById('vol-vocal').value);

        this.musicGain = this.ctx.createGain();
        this.musicGain.gain.value = parseFloat(document.getElementById('vol-music').value);

        // Анализатор для реактивной подсветки сцены
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 128;
        this.freqData = new Uint8Array(this.analyser.frequencyBinCount);

        // Выход для записи WebM
        this.mediaStreamDest = this.ctx.createMediaStreamDestination();

        this.vocalGain.connect(this.masterGain);
        this.musicGain.connect(this.masterGain);
        this.masterGain.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
        this.masterGain.connect(this.mediaStreamDest);
      }

      makeDistortionCurve(amount) {
        const k = typeof amount === 'number' ? amount : 50;
        const n_samples = 44100;
        const curve = new Float32Array(n_samples);
        const deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
          const x = (i * 2) / n_samples - 1;
          curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
        }
        return curve;
      }

      async loadCustomVocalFile(file) {
        this.init();
        const arrayBuffer = await file.arrayBuffer();
        this.customAudioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
        this.isCustomVocalActive = true;
        if (this.isPlaying) {
          const pos = this.getCurrentTime();
          this.stop(false);
          this.play(pos);
        }
      }

      play(offset = this.pauseOffset) {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (this.isPlaying) return;

        this.isPlaying = true;
        this.pauseOffset = offset;
        this.startTime = this.ctx.currentTime - offset;

        const stepDuration = BEAT_DURATION / 4; // 16-я нота
        this.currentStep = Math.floor(offset / stepDuration);
        this.nextStepTime = this.ctx.currentTime;

        // Если загружен пользовательский вокальный файл — запускаем его синхронно
        if (this.isCustomVocalActive && this.customAudioBuffer) {
          this.customBufferSource = this.ctx.createBufferSource();
          this.customBufferSource.buffer = this.customAudioBuffer;
          this.customBufferSource.connect(this.vocalGain);
          if (offset < this.customAudioBuffer.duration) {
            this.customBufferSource.start(0, offset);
          }
        }

        this.schedulerTimer = setInterval(() => this.schedule(), 25);
      }

      pause() {
        if (!this.isPlaying) return;
        this.pauseOffset = this.getCurrentTime();
        this.isPlaying = false;
        clearInterval(this.schedulerTimer);
        if (this.customBufferSource) {
          try { this.customBufferSource.stop(); } catch (e) {}
          this.customBufferSource = null;
        }
      }

      stop(resetOffset = true) {
        this.isPlaying = false;
        clearInterval(this.schedulerTimer);
        if (this.customBufferSource) {
          try { this.customBufferSource.stop(); } catch (e) {}
          this.customBufferSource = null;
        }
        if (resetOffset) {
          this.pauseOffset = 0;
          this.currentStep = 0;
        }
      }

      seek(newTime) {
        const clamped = Math.max(0, Math.min(TOTAL_DURATION - 0.05, newTime));
        const wasPlaying = this.isPlaying;
        this.stop(false);
        this.pauseOffset = clamped;
        if (wasPlaying) {
          this.play(clamped);
        }
      }

      getCurrentTime() {
        if (!this.isPlaying) return this.pauseOffset;
        const elapsed = this.ctx.currentTime - this.startTime;
        if (elapsed >= TOTAL_DURATION) {
          // Зацикливание или остановка в конце клипа
          this.seek(0);
          return 0;
        }
        return elapsed;
      }

      getAudioEnergy() {
        if (!this.analyser || !this.isPlaying) return { bass: 0, mid: 0, high: 0 };
        this.analyser.getByteFrequencyData(this.freqData);
        let bass = 0, mid = 0, high = 0;
        for (let i = 0; i < 10; i++) bass += this.freqData[i];
        for (let i = 10; i < 32; i++) mid += this.freqData[i];
        for (let i = 32; i < 64; i++) high += this.freqData[i];
        return {
          bass: bass / (10 * 255),
          mid: mid / (22 * 255),
          high: high / (32 * 255)
        };

        const lookahead = 0.12;
        const stepDuration = BEAT_DURATION / 4;

        while (this.nextStepTime < this.ctx.currentTime + lookahead) {

          this.nextStepTime += stepDuration;
          this.currentStep++;

        // 1. РОК-УДАРНЫЕ (Кик, Рабочий барабан, Хай-хэт / Крэш)
        // Кик на 0, 3, 6, 8, 10, 14 (драйвовый панк/хард-рок грув)

        }

        }

        const chordRoots = [82.41, 98.00, 110.00, 130.81]; // E2, G2, A2, C3

        gain.connect(this.musicGain);
        osc.start(time);
        osc.stop(time + duration + 0.02);

        osc2.connect(formant);
        formant.connect(gain);
        gain.connect(this.vocalGain);

    function createRockerCharacter(member) {

    // Позы рук (из режима «Группа» в Скелетике): гитара/бас и ударные
    const GT = [
      { LA:[-0.098,0.231,0.329,-1.981], LB:[-0.539,0.455,0.579,-1.808], RU:[0.271,1.177,-0.983,-1.206], RD:[0.177,1.274,-0.889,-0.931] },
      { LA:[-0.297,0.379,0.431,-1.926], LB:[-0.808,0.4,0.827,-1.577], RU:[0.271,1.177,-0.983,-1.206], RD:[0.177,1.274,-0.889,-0.931] }
    ];
    const AT0 = [
      [[-0.191,-0.212,-0.155,-1.211,-0.302,-0.196,-0.157,-0.8],[0.032,0.314,0.267,-1.782,0.052,0.271,0.232,-1.53],[-0.894,0.653,0.75,-1.895,-0.702,0.729,0.655,-1.9]],

    ];
    function lerpA(a, b, w) { return a.map((v, i) => v + (b[i] - v) * w); }
    function SJ(R, n, x, y, z) { R[n].rotation.set(x || 0, y || 0, z || 0); }
    // Точная логика ударов из «Скелетика — полигона движений» (hit(0, k, b)):
    // руки работают только по малому (0) и томам (1) ниже плоскости тарелок, без взмаха сквозь железо
    function drumHit(h, k, bar) {
      const hs = [-1, -1];
      let r = -1;
      if (k === 0 || k === 8 || k === 10) { r = 1; hs[1] = 1; }
      if (k === 4 || k === 12) { r = 0; hs[0] = 0; }
      if (k % 2 === 0) { if (r < 0) { r = (k % 4) ? 1 : 0; hs[r] = 0; } }
      if (k === 0 && (bar & 3) === 0) hs[0] = 1;
      if (k === 14) hs[0] = 1;
      return hs[h];
    }
    function animateBot(m, idx, now, dt, soloId, kick) {
      const c = characterMeshes[m.id], R = c.R, playing = engine.isPlaying, solo = m.id === soloId;
      const beat = now / BEAT_DURATION, bb = playing ? Math.sin(beat * PI) : 0, ab = Math.abs(bb);
      const stepDur = BEAT_DURATION / 4, s = Math.floor(now / stepDur);
      if (c.kind === 'drums') {
        const A = [];
        for (let h = 0; h < 2; h++) {
          let ls = -1, tg = 0;
          for (let d = 0; d < 16; d++) { const sp = s - d; if (sp < 0) break; const t = drumHit(h, sp % 16, Math.floor(sp / 16) % TOTAL_BARS); if (t >= 0) { ls = sp; tg = t; break; } }
          const ar = (playing && ls >= 0) ? Math.exp(-Math.max(0, now - ls * stepDur) * 10) : 0, e = AT0[h][tg];
          A.push([0, 1, 2, 3].map(j => e[j] + (e[j + 4] - e[j]) * ar));
        }

        SJ(R, 'shL', c.Q[0][0], c.Q[0][1], c.Q[0][2]); SJ(R, 'elL', c.Q[0][3]); SJ(R, 'shR', c.Q[1][0], c.Q[1][1], c.Q[1][2]); SJ(R, 'elR', c.Q[1][3]);
      } else {
        const G = GT[c.kind === 'bass' ? 1 : 0], env = playing ? Math.exp(-(now % (BEAT_DURATION / 2)) * 10) : 0;
        const lp = lerpA(G.LA, G.LB, 0.5 + 0.5 * Math.sin(now * 1.4 + idx)), rp = lerpA(G.RU, G.RD, env);
        SJ(R, 'shL', lp[0], lp[1], lp[2]); SJ(R, 'elL', lp[3]); SJ(R, 'shR', rp[0], rp[1], rp[2]); SJ(R, 'elR', rp[3]);
      }

      R.head.rotation.set(playing ? Math.sin(beat * PI * 2) * (solo ? 0.35 : 0.15) : 0, 0.12 * Math.sin(now * 1.5 + idx), 0);
      const bk = c.kind === 'drums' ? 0 : 1; R.chest.rotation.set(bk * (0.05 * bb - (solo ? 0.1 : 0) + (c.seat ? 0.08 : 0)), 0, 0); R.spine.rotation.set(bk * 0.03 * bb, 0, 0);
      const a = c.seat ? -1.5 : -0.1, b = c.seat ? 1.5 + 0.1 * ab : 0.1 + 0.2 * ab + (solo ? 0.15 : 0), sp = c.seat ? 0.1 : 0.06 + (solo ? 0.14 : 0);
      R.hipL.rotation.set(a, 0, sp); R.hipR.rotation.set(a, 0, -sp); R.knL.rotation.set(b, 0, 0); R.knR.rotation.set(b, 0, 0);
      R.hips.position.y = c.seat ? 0.16 : 0.07 + 0.45 * (Math.cos(a) + Math.cos(a + b));
      if (c.kind === 'drums') c.inst.position.y = c.inst.userData.y0 + (R.hips.position.y - 0.97);
      // подпрыгивание, кольцо и свечение акцентов у солиста
      c.root.position.y = c.basePos.y + (playing ? Math.abs(Math.sin(beat * PI + idx)) * (solo ? 0.14 : 0.05) * (c.seat ? 0.4 : 1) : 0);
      c.ring.scale.setScalar(solo ? 1.15 + kick * 0.25 : 0.75); c.ring.material.opacity = solo ? 0.95 : 0.2;
      c.acc.emissive.setHex(c.st.acc); c.acc.emissiveIntensity = solo ? 0.45 + kick * 0.5 : 0.06;
    }


    /**
     * ============================================================================
     * 4. УПРАВЛЕНИЕ UI, СИНХРОНИЗАЦИЯ ТАЙМЛАЙНА И ЗАПИСЬ В WEBM
     * ============================================================================

    const engine = new RockAudioEngine();

    // Утилита уведомлений без alert()
    function showToast(text) {
      const el = document.getElementById('toast-msg');
      el.textContent = text;
      el.style.opacity = '1';
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.style.opacity = '0'; }, 2800);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('time-total').textContent = formatTime(TOTAL_DURATION);

    // Кнопка Play / Pause
    const btnPlay = document.getElementById('btn-play');
    btnPlay.addEventListener('click', () => {
      if (engine.isPlaying) {
        engine.pause();
        document.getElementById('play-icon').textContent = '▶';
        document.getElementById('play-text').textContent = 'PLAY';
      } else {
        engine.play();
        document.getElementById('play-icon').textContent = '❚❚';
        document.getElementById('play-text').textContent = 'PAUSE';
      }
    });

    // Кнопка Stop
    document.getElementById('btn-stop').addEventListener('click', () => {
      engine.stop(true);
      document.getElementById('play-icon').textContent = '▶';
      document.getElementById('play-text').textContent = 'PLAY';
    });

    // Перемотка по полосе прогресса
    document.getElementById('timeline-bar').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      engine.seek(ratio * TOTAL_DURATION);
    });

    // Фейдеры громкости
    document.getElementById('vol-vocal').addEventListener('input', (e) => {
      if (engine.vocalGain) engine.vocalGain.gain.value = parseFloat(e.target.value);
    });
    document.getElementById('vol-music').addEventListener('input', (e) => {
      if (engine.musicGain) engine.musicGain.gain.value = parseFloat(e.target.value);
    });

    // Загрузка пользовательского аудиофайла (MP3 / WAV)
    document.getElementById('audio-upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        showToast(`Загрузка трека: ${file.name}...`);
        await engine.loadCustomVocalFile(file);
        document.getElementById('vocal-source-label').textContent = `Файл: ${file.name.slice(0, 18)}`;
        showToast('Аудиофайл синхронизирован с 3D-сценой!');
      } catch (err) {
        showToast('Ошибка декодирования аудиофайла');
      }
    });

    // Переключение 16:9 / 9:16
    document.getElementById('btn-aspect').addEventListener('click', () => {
      isPortrait = !isPortrait;
      const wrapper = document.getElementById('canvas-container');
      wrapper.classList.toggle('portrait-mode', isPortrait);
      document.getElementById('aspect-label').textContent = isPortrait ? '9:16' : '16:9';
      document.getElementById('aspect-icon').textContent = isPortrait ? '▯' : '▭';
      setTimeout(onResize, 360);
    });

    // Переключение авто-камеры
    document.getElementById('btn-autocam').addEventListener('click', () => {
      autoCamera = !autoCamera;
      document.getElementById('autocam-label').textContent = autoCamera ? 'Авто-камера: ВКЛ' : 'Авто-камера: РУЧНАЯ';
      showToast(autoCamera ? 'Автоматический режиссер включен' : 'Ручное управление камерой (мышь/тач)');
    });

    // Селектор солистов
    document.querySelectorAll('.solo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        manualSoloist = btn.dataset.soloist;
        document.querySelectorAll('.solo-btn').forEach(b => {
          b.className = 'solo-btn px-2 py-1.5 rounded-lg text-[10px] font-mono-tech font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition';
        });
        btn.className = 'solo-btn px-2 py-1.5 rounded-lg text-[10px] font-mono-tech font-bold bg-rose-600 text-white border border-rose-400/50 transition';
      });
    });

    // Запись клипа в WebM (Canvas + Web Audio API Stream)
    document.getElementById('btn-record').addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }
      try {
        engine.init();
        const canvasStream = renderer.domElement.captureStream(30);
        const audioTracks = engine.mediaStreamDest.stream.getAudioTracks();
        const combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp9,opus' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `kot_platzkart_rock_${isPortrait ? '9x16' : '16x9'}.webm`;
          a.click();
          URL.revokeObjectURL(url);

          document.getElementById('rec-label').textContent = 'Запись WebM';
          document.getElementById('rec-indicator').classList.remove('rec-dot', 'bg-rose-200');
          showToast('Видеоклип WebM сохранен!');
        };

        mediaRecorder.start();
        if (!engine.isPlaying) btnPlay.click();

        document.getElementById('rec-label').textContent = 'Стоп & Скачать';
        document.getElementById('rec-indicator').classList.add('rec-dot', 'bg-rose-200');
        showToast('Идет запись 3D-клипа со звуком...');
      } catch (err) {
        showToast('Браузер не поддерживает прямой захват WebM');
      }
    });

    // Адаптивный ресайз
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);

    /**
     * ============================================================================
     * 5. ГЛАВНЫЙ ЦИКЛ РЕНДЕРА И СИНХРОНИЗАЦИИ АНИМАЦИИ С 136 BPM
     * ============================================================================
     */
    let lastSectionLabel = '';
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const now = engine.getCurrentTime();
      const currentBar = now / BAR_DURATION;
      const beatPhase = (now % BEAT_DURATION) / BEAT_DURATION; // 0..1 на каждый удар
      const kickPulse = Math.pow(1 - beatPhase, 3); // Резкий импульс на сильную долю

      // Обновление UI времени и прогресс-бара
      document.getElementById('time-current').textContent = formatTime(now);
      document.getElementById('timeline-progress').style.width = `${(now / TOTAL_DURATION) * 100}%`;

      // Пульсация LED-индикатора BPM
      const led = document.getElementById('beat-led');
      led.style.transform = `scale(${1 + kickPulse * 0.45})`;

      // Определение активной секции по таймлайн-манифесту
      const activeSection = TIMELINE_SECTIONS.find(s => currentBar >= s.startBar && currentBar < s.endBar) || TIMELINE_SECTIONS[0];
      const activeSoloistId = manualSoloist === 'AUTO' ? activeSection.soloist : manualSoloist;
      const soloistMeta = BAND_MEMBERS.find(m => m.id === activeSoloistId) || BAND_MEMBERS[0];

      if (activeSection.label !== lastSectionLabel) {
        lastSectionLabel = activeSection.label;
        document.getElementById('section-badge').textContent = activeSection.label;
        document.getElementById('subtitle-main').textContent = activeSection.lyricMain;
        document.getElementById('subtitle-sub').textContent = activeSection.lyricSub;
      }

      document.getElementById('soloist-pill').textContent = `СОЛИСТ: ${soloistMeta.name}`;
      document.getElementById('soloist-pill').style.borderColor = soloistMeta.hex;
      document.getElementById('soloist-pill').style.color = soloistMeta.hex;

      // Энергия аудиоспектра
      const energy = engine.getAudioEnergy();
      const totalDrive = engine.isPlaying ? Math.max(kickPulse * 0.7, energy.bass) : 0.1;

      // Движение огней и столбов за окнами вагона (эффект скорости поезда)
      const trainSpeed = engine.isPlaying ? 28 : 6;
      outsideObjects.forEach(obj => {
        obj.mesh.position.z += delta * trainSpeed;
        if (obj.mesh.position.z > 10) {
          obj.mesh.position.z -= 60;
        }
      });

      // Пролетающий свет из окна в такт движению состава
      windowPassingLight.position.z = ((now * 24) % 16) - 8;
      windowPassingLight.intensity = engine.isPlaying ? (2.2 + kickPulse * 2.5) : 1.0;

      // Сценический свет под цвет активного солиста + стробоскоп в припеве/соло
      spotMain.color.setHex(soloistMeta.color);
      spotMain.intensity = 2.4 + totalDrive * 3.2;
      neonStripMat.color.setHex(soloistMeta.color);

      // Анимация 6 образов из Скелетика
      BAND_MEMBERS.forEach((m, idx) => animateBot(m, idx, now, delta, activeSoloistId, kickPulse));

      // Режиссерская авто-камера с легким роковым шейком на сильные доли
      if (autoCamera) {
        const targetChar = characterMeshes[activeSoloistId];
        const targetPos = targetChar.basePos.clone().add(new THREE.Vector3(0, targetChar.seat ? 0.55 : 0.85, 0));
        controls.target.lerp(targetPos, 0.06);

        const camAngle = now * 0.35;
        const shakeX = engine.isPlaying ? (Math.random() - 0.5) * kickPulse * 0.07 : 0;
        const shakeY = engine.isPlaying ? (Math.random() - 0.5) * kickPulse * 0.07 : 0;

        const desiredCamPos = new THREE.Vector3(
          targetChar.basePos.x * (targetChar.seat ? 0.1 : 0.45) + Math.sin(camAngle) * (targetChar.seat ? 0.6 : 0.85) + shakeX,
          targetChar.basePos.y + (targetChar.seat ? 0.75 : 1.2) + Math.cos(camAngle * 0.7) * 0.2 + shakeY,
          targetChar.basePos.z + (isPortrait ? 2.45 : 1.95)
        );
        camera.position.lerp(desiredCamPos, 0.045);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = () => {
      onResize();
      animate();
    };
  </script>
</body>
</html>
