<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поздравление — плавающие буквы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kurale&family=Old+Standard+TT&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
  :root { --bg:#10201f; --panel:#18302e; --ink:#e9e2cf; --gold:#e2b857; --line:#2f4b48; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; min-height:45vh; }
  #out { font-family:'Ruslan Display',Georgia,serif; color:var(--gold); font-size:clamp(28px,6vw,64px); line-height:1.5; text-align:center; max-width:960px; --glow:0px; }
  #stage { position:relative; overflow:hidden; }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #out { position:relative; z-index:1; }
  button { background:var(--gold); color:#10201f; border:0; border-radius:6px; padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  body.card #panel { display:none; }
  body.card #stage { min-height:100vh; }
  body.card #out { font-size:clamp(32px,7vw,96px); max-width:1100px; }
  #cardbar { display:none; position:fixed; bottom:14px; left:50%; transform:translateX(-50%); gap:8px; z-index:10; opacity:.45; transition:opacity .2s; }
  body.card #cardbar { display:flex; }
  #cardbar:hover, #cardbar:focus-within { opacity:1; }
  #bg { position:absolute; inset:0; background-size:cover; background-position:center; --dim:.3; }
  #bg.has::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,var(--dim)); }
  body.final #panel, body.final #cardback { display:none !important; }
  input[type=file] { font:inherit; font-size:13px; max-width:100%; }
  body.final #cardshot, body.final #cardvid { display:none; }
  #toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--gold); color:#10201f; padding:8px 14px; border-radius:6px; font-weight:600; z-index:20; display:none; }
  .w { display:inline-block; white-space:nowrap; }
  .c { display:inline-block; will-change:transform; text-shadow:0 0 var(--glow) currentColor; }
  .sp { display:inline-block; width:.3em; }
  #panel { background:var(--panel); border-top:1px solid var(--line); padding:20px 24px; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:900px){ #panel{ grid-template-columns:1fr 2fr; } .ctl{ grid-template-columns:1fr 1fr; column-gap:28px; } }
  textarea { width:100%; min-height:110px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px; font:16px/1.4 system-ui,sans-serif; resize:vertical; }
  .ctl { display:grid; gap:10px; align-content:start; }
  label { display:grid; grid-template-columns:120px 1fr 44px; align-items:center; gap:10px; font-size:14px; }
  output { text-align:right; color:var(--gold); }
  input[type=range] { width:100%; accent-color:var(--gold); }
  select { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
  input[type=color] { width:44px; height:30px; padding:0; border:1px solid var(--line); background:none; }
  input[type=checkbox] { justify-self:start; width:20px; height:20px; accent-color:var(--gold); }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  #note { font-size:13px; opacity:.7; margin:8px 0 0; }
  #tap { position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; width:100%; border-radius:0; background:rgba(16,32,31,.92); color:var(--gold); font-size:clamp(22px,5vw,44px); font-family:'Ruslan Display',Georgia,serif; font-weight:400; }
  #tap small { font:inherit; font-size:.45em; color:var(--ink); opacity:.8; }
  body.final.hasmusic:not(.started) #tap { display:flex; }
  #cardmus { display:none; }
  body.hasmusic #cardmus { display:inline-block; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><canvas id="fx" aria-hidden="true"></canvas><div id="out" aria-live="polite"></div></div>

<div id="toast" role="status"></div>
<button id="tap" type="button">▶ Открыть открытку<small>со звуком</small></button>
<div id="cardbar"><button id="cardpop" type="button">Бабах!</button><button id="cardmus" type="button">♪ Музыка</button><button id="cardshot" type="button">Фото</button><button id="cardvid" type="button">Видео</button><button id="cardback" type="button">Назад к настройкам</button></div>
<div id="panel">
  <div>
    <textarea id="txt" aria-label="Текст поздравления">Вітаю з Днем народження! Нехай кожен день буде світлим, а серце — спокійним.</textarea>
    <p id="note">Проверка украинских букв: Ґанок, їжак, єдність, Київ. Чтобы крутить вручную, сними галочку «Анимация» и двигай «Сдвиг вручную».</p>
  </div>
  <div class="ctl">
    <label>Шрифт<select id="font"><option>Ruslan Display</option><option>Kurale</option><option>Old Standard TT</option></select><span></span></label>
    <label>Анимация<input id="anim" type="checkbox" checked><span></span></label>
    <label>Цвет<select id="cmode"><option value="one">Один цвет</option><option value="grad">Градиент</option><option value="rainbow">Радуга</option></select><input id="c1" type="color" value="#e2b857"></label>
    <label>Цвет 2 (градиент)<input id="c2" type="color" value="#d9534f"><span></span></label>
    <label>Свечение<input id="glow" type="range" min="0" max="30" value="0"><output></output></label>
    <label>Скорость<input id="speed" type="range" min="1" max="30" value="10"><output></output></label>
    <label>Сдвиг вручную<input id="shift" type="range" min="0" max="63" value="0"><output></output></label>
    <label>Шаг фазы<input id="phase" type="range" min="1" max="12" value="5"><output></output></label>
    <label>Волна (высота)<input id="amp" type="range" min="0" max="40" value="12"><output></output></label>
    <label>Качание вбок<input id="sway" type="range" min="0" max="30" value="0"><output></output></label>
    <label>Пульс (размер)<input id="pulse" type="range" min="0" max="100" value="20"><output></output></label>
    <label>Наклон (°)<input id="tilt" type="range" min="0" max="360" value="8"><output></output></label>
    <label>Кручение<input id="spin" type="range" min="-30" max="30" value="0"><output></output></label>
    <label>Дрожание<input id="jit" type="range" min="0" max="10" value="0"><output></output></label>
    <label>Падает<select id="fxmode"><option value="none">Ничего</option><option value="confetti">Конфетти и серпантин</option><option value="stars">Звёзды</option><option value="snow">Снег</option></select><span></span></label>
    <label>Количество<input id="fxcount" type="range" min="10" max="300" value="80"><output></output></label>
    <label>Скорость падения<input id="fxspeed" type="range" min="1" max="10" value="4"><output></output></label>
    <label>Хлопушка<button id="pop" type="button">Бабах!</button><span></span></label>
    <label>Открытка<button id="cardbtn" type="button">Режим открытки</button><span></span></label>
    <label>Фон (фото)<span style="grid-column:2/4"><input id="bgfile" type="file" accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp"><small id="bgstat" style="display:block;margin-top:4px;opacity:.8">Фото не выбрано</small></span></label>
    <label>Затемнение фона<input id="dim" type="range" min="0" max="80" value="30"><output>30</output></label>
    <label>Убрать фон<button id="bgclear" type="button">Убрать</button><span></span></label>
    <label>Музыка (MP3)<span style="grid-column:2/4"><input id="mfile" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.wav,.flac"><small id="mstat" style="display:block;margin-top:4px;opacity:.8">Музыка не выбрана</small></span></label>
    <label>Начало фрагмента<input id="mstart" type="range" min="0" max="0" value="0" disabled data-nosave="1"><output>0:00</output></label>
    <label>Длина фрагмента<input id="mlen" type="range" min="1" max="15" value="15" disabled data-nosave="1"><output>15 с</output></label>
    <label>Громкость<input id="mvol" type="range" min="0" max="100" value="80" data-nosave="1"><output>80</output></label>
    <label>Плавное затухание<input id="mfade" type="checkbox" checked data-nosave="1"><span></span></label>
    <label>Повторять<input id="mloop" type="checkbox" checked data-nosave="1"><span></span></label>
    <label>Звук<span style="grid-column:2/4;display:flex;gap:8px"><button id="mplay" type="button" disabled>▶ Прослушать</button><button id="mclear" type="button">Убрать музыку</button></span></label>
    <label>Готовая открытка<button id="save" type="button">Сохранить файл</button><span></span></label>
    <label>Сохранить как<span style="grid-column:2/4;display:flex;gap:8px"><button id="shot" type="button">Фото (PNG)</button><button id="vid" type="button">Видео</button></span></label>
    <label>Длина видео<select id="vlen"><option value="3">3 сек</option><option value="5" selected>5 сек</option><option value="8">8 сек</option><option value="10">10 сек</option><option value="15">15 сек</option><option value="frag">Как фрагмент музыки</option></select><span></span></label>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var out = $('out'), txt = $('txt'), anim = $('anim');
  var ids = ['glow','speed','shift','phase','amp','sway','pulse','tilt','spin','jit'];
  var el = {}; ids.forEach(function (id) { el[id] = $(id); });
  var chars = [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) anim.checked = false;

  function build() {
    out.textContent = ''; chars = [];
    var words = txt.value.split(/\s+/).filter(Boolean);
    words.forEach(function (word, wi) {
      var w = document.createElement('span'); w.className = 'w';
      Array.from(word).forEach(function (ch) {
        var s = document.createElement('span'); s.className = 'c'; s.textContent = ch;
        w.appendChild(s); chars.push(s);
      });
      out.appendChild(w);
      if (wi < words.length - 1) {
        var sp = document.createElement('span'); sp.className = 'sp'; out.appendChild(sp);
        out.appendChild(document.createTextNode(' '));
      }
    });
  }

  function showValues() {
    ids.forEach(function (id) { el[id].nextElementSibling.textContent = el[id].value; });
    out.style.setProperty('--glow', el.glow.value + 'px');
  }

  function hex(h) { return [1,3,5].map(function (i) { return parseInt(h.substr(i,2),16); }); }
  function mix(a, b, k) { return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i]-v)*k); }).join(',') + ')'; }

  function frame(ms) {
    var t = anim.checked ? ms / 1000 * (el.speed.value / 5) : el.shift.value / 10;
    var amp = +el.amp.value, sway = +el.sway.value, pulse = el.pulse.value / 100,
        tilt = +el.tilt.value, spin = +el.spin.value, jit = +el.jit.value, step = el.phase.value / 10;
    var mode = $('cmode').value, a = hex($('c1').value), b = hex($('c2').value), n = chars.length;
    for (var i = 0; i < n; i++) {
      var p = t + i * step;
      var x = Math.sin(p * 0.8 + 3) * sway + Math.sin(p * 17 + i * 3.1) * jit;
      var y = Math.sin(p) * amp + Math.cos(p * 19 + i * 5.3) * jit;
      var sc = 1 + Math.sin(p * 0.9 + 1) * pulse * 0.5;
      var r = Math.sin(p * 1.1 + 2) * tilt + spin * p * 20;
      var c = mode === 'rainbow' ? 'hsl(' + (((i * 18 + t * 40) % 360) + 360) % 360 + ',80%,62%)'
            : mode === 'grad' ? mix(a, b, n > 1 ? i / (n - 1) : 0) : $('c1').value;
      var s = chars[i].style;
      s.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + r.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      s.color = c;
    }
    requestAnimationFrame(frame);
  }

  txt.addEventListener('input', build);
  $('font').addEventListener('change', function () { out.style.fontFamily = "'" + this.value + "',Georgia,serif"; });
  ids.forEach(function (id) { el[id].addEventListener('input', showValues); });
  build(); showValues();
  requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), cv = $('fx'), ctx = cv.getContext('2d');
  var modeEl = $('fxmode'), countEl = $('fxcount'), speedEl = $('fxspeed');
  var COLORS = ['#e2b857','#d9534f','#5bc0de','#7bd88f','#f08bd0','#ffffff'];
  var W = 0, H = 0, dpr = 1, parts = [], burst = [], last = 0, tt = 0, lastMode = 'none';
  var R = function (a, b) { return a + Math.random() * (b - a); };

  [countEl, speedEl].forEach(function (e) {
    var o = e.nextElementSibling, f = function () { o.textContent = e.value; };
    e.addEventListener('input', f); f();
  });

  function size() {
    var r = stage.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    if (r.width !== W || r.height !== H) {
      W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
  }
  function kindFor(mode) {
    if (mode === 'stars') return 'star';
    if (mode === 'snow') return 'snow';
    return Math.random() < 0.4 ? 'stream' : 'rect';
  }
  function make(kind, x, y) {
    return { k: kind, x: x, y: y, vx: 0, vy: R(40, 110), rot: R(0, 6.28), vr: R(-3, 3),
             s: kind === 'snow' ? R(2, 5) : kind === 'star' ? R(5, 11) : R(6, 12),
             col: kind === 'snow' ? '#ffffff' : kind === 'star' ? (Math.random() < 0.6 ? '#e2b857' : '#fff6d6') : COLORS[(Math.random() * COLORS.length) | 0],
             ph: R(0, 6.28), sw: R(0.8, 2), dr: R(8, 30) };
  }
  function pop() {
    var mode = 'confetti';
    var vmax = Math.sqrt(2 * 600 * Math.max(H, 200) * 0.9);
    for (var i = 0; i < 80; i++) {
      var left = i % 2 === 0, p = make(kindFor(mode), left ? W * 0.05 : W * 0.95, H + 10);
      p.vx = (left ? 1 : -1) * R(80, 420); p.vy = -vmax * R(0.55, 1); p.burst = true;
      burst.push(p);
    }
  }
  $('pop').addEventListener('click', pop);

  function draw(p) {
    ctx.save();
    if (p.k === 'star') {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(tt * 3 + p.ph);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.beginPath();
      for (var i = 0; i < 10; i++) {
        var r = i % 2 ? p.s * 0.45 : p.s, a = i * Math.PI / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
    } else if (p.k === 'snow') {
      ctx.globalAlpha = 0.85; ctx.fillStyle = p.col; ctx.beginPath();
      ctx.arc(p.x, p.y, p.s * 0.5, 0, 6.28); ctx.fill();
    } else if (p.k === 'stream') {
      ctx.strokeStyle = p.col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
      for (var k = 0; k < 14; k++) ctx.lineTo(p.x + Math.sin(p.ph + k * 0.55 + tt * 2) * 7, p.y - k * 5);
      ctx.stroke();
    } else {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.ph + tt * 4));
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    }
    ctx.restore();
  }

  function frame(ms) {
    var dt = Math.min(0.05, (ms - last) / 1000 || 0); last = ms; tt += dt;
    size(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    var mode = modeEl.value, sp = speedEl.value / 4, i, p;
    if (mode !== lastMode) { parts = []; lastMode = mode; }
    if (mode !== 'none') {
      var target = +countEl.value;
      while (parts.length < target) parts.push(make(kindFor(mode), R(0, W), parts.length < 1 ? R(0, H) : R(-H * 0.3, H)));
      if (parts.length > target) parts.length = target;
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        p.y += p.vy * sp * dt; p.x += Math.sin(p.ph + tt * p.sw) * p.dr * dt; p.rot += p.vr * dt;
        if (p.y > H + 20) { p.y = -20; p.x = R(0, W); }
        draw(p);
      }
    }
    for (i = burst.length - 1; i >= 0; i--) {
      p = burst[i]; p.vy += 600 * dt; p.vx *= 0.995; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt * 3;
      if (p.vy > 0) p.vy = Math.min(p.vy, 140 + p.s * 6);
      if (p.y > H + 30) burst.splice(i, 1); else draw(p);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function open() {
    document.body.classList.add('card');
    var d = document.documentElement;
    if (d.requestFullscreen) { try { d.requestFullscreen().catch(function () {}); } catch (e) {} }
  }
  function close() {
    document.body.classList.remove('card');
    if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) {} }
  }
  $('cardbtn').addEventListener('click', open);
  $('cardback').addEventListener('click', close);
  $('cardpop').addEventListener('click', function () { $('pop').click(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement) document.body.classList.remove('card'); });
})();
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var bg = $('bg'), dim = $('dim');

  dim.addEventListener('input', function () {
    bg.style.setProperty('--dim', dim.value / 100);
    dim.nextElementSibling.textContent = dim.value;
  });
  var stat = $('bgstat');
  function setBg(src, w, h, f) {
    var k = Math.min(1, 1600 / Math.max(w, h));
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
    var cx = cv.getContext('2d');
    cx.fillStyle = '#10201f'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.drawImage(src, 0, 0, cv.width, cv.height);
    bg.style.backgroundImage = 'url("' + cv.toDataURL('image/jpeg', 0.85) + '")';
    bg.classList.add('has');
    stat.textContent = 'Фон установлен: ' + w + '×' + h + ' (' + f.name + ')';
  }
  function explain(f, why) {
    var kb = Math.round(f.size / 1024) + ' КБ';
    f.slice(0, 16).arrayBuffer().then(function (buf) {
      var b = new Uint8Array(buf), t = String.fromCharCode.apply(null, Array.from(b));
      var msg;
      if (f.size === 0) msg = 'файл пустой (0 байт). Если он лежит в облаке (OneDrive, Google Диск), сначала скачай его на компьютер.';
      else if (b[0] === 0x3C || /^\s*(<|\{)/.test(t)) msg = 'внутри не картинка, а текст или веб-страница. Скорее всего, фото скачалось неправильно. Сохрани его заново через «Сохранить картинку как…».';
      else if (t.slice(4, 8) === 'ftyp' && /hei|mif|msf/.test(t.slice(8, 12))) msg = 'это формат HEIC (так снимает iPhone), Chrome его не открывает. Пересохрани как JPG.';
      else if (b[0] === 0xFF && b[1] === 0xD8) msg = 'JPEG-файл повреждён или обрезан.';
      else if (t.slice(0, 4) === 'RIFF' || t.slice(0, 3) === 'GIF' || b[0] === 0x89) msg = 'формат распознан, но браузер не смог его декодировать. Попробуй пересохранить файл в другом редакторе.';
      else msg = 'формат не распознан (первые байты: ' + Array.from(b.slice(0, 8)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join(' ') + ').';
      stat.textContent = 'Не удалось открыть «' + f.name + '» (' + kb + '): ' + msg;
    }, function (e) {
      stat.textContent = 'Не удалось прочитать «' + f.name + '» с диска (' + (e && e.name || 'ошибка') + '). Скопируй файл в обычную папку, например на рабочий стол, и выбери снова.';
    });
  }
  $('bgfile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) { stat.textContent = 'Фото не выбрано'; return; }
    stat.textContent = 'Читаю «' + f.name + '»…';
    function viaImage() {
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        try { setBg(img, img.width, img.height, f); } catch (e) { stat.textContent = 'Ошибка обработки: ' + e.message; }
      };
      img.onerror = function () { URL.revokeObjectURL(url); explain(f); };
      img.src = url;
    }
    if (window.createImageBitmap) {
      createImageBitmap(f).then(function (bmp) {

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var cache = { key: '', img: null }, recording = false;
  var RE = /translate\(([-\d.eE+]+)px,\s*([-\d.eE+]+)px\)\s*rotate\(([-\d.eE+]+)deg\)\s*scale\(([-\d.eE+]+)\)/;

    return new Promise(function (res) {
      var im = new Image();

        cy: out.offsetTop + e.offsetTop + e.offsetHeight / 2 };
    });

        fs: parseFloat(cs.fontSize), fam: cs.fontFamily,

    });
  }
  function draw(ctx, P) {
    var k = P.cw / P.W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#10201f'; ctx.fillRect(0, 0, P.cw, P.ch);

    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

    prepare(function (W) { return Math.min(3, Math.max(1, 1920 / W)); }).then(function (P) {
      var c = document.createElement('canvas'); c.width = P.cw; c.height = P.ch;

      c.toBlob(function (b) { download(b, 'otkrytka.png'); }, 'image/png');

  }

    if (recording) return;
    if (!window.MediaRecorder) { alert('Этот браузер не умеет записывать видео. Открой файл в Chrome или Edge.'); return; }
    var secs = $('vlen').value === 'frag' ? ((window.CardMusic && window.CardMusic.fragLen()) || 5) : +$('vlen').value;
    if (window.CardMusic) window.CardMusic.warm();
    prepare(function (W) { return Math.min(2, 1280 / W); }).then(function (P) {
      var c = document.createElement('canvas'); c.width = P.cw; c.height = P.ch;
      var ctx = c.getContext('2d');

        .filter(function (t) { return MediaRecorder.isTypeSupported(t); })[0] || '';

      if (atr) atr.forEach(function (t) { vstream.addTrack(t); });

      var chunks = [];
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        if (window.CardMusic) window.CardMusic.end();
        recording = false; toast.style.display = 'none';
        var type = rec.mimeType || 'video/webm';
        download(new Blob(chunks, { type: type }), 'otkrytka.' + (/mp4/.test(type) ? 'mp4' : 'webm'));

        var el = (performance.now() - t0) / 1000;
        draw(ctx, P);
        toast.style.display = 'block'; toast.textContent = 'Идёт запись, не закрывай вкладку: ' + Math.max(0, Math.ceil(secs - el)) + ' с';

    });
  }

  $('vid').addEventListener('click', video); $('cardvid').addEventListener('click', video);
})();
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var au = new Audio(); au.preload = 'auto';
  var file = null, url = '', fixed = null, dur = 0, loaded = false, playing = false, timer = 0, recEnd = null;
  var ctx = null, gain = null, dest = null;
  var FADE = 1.5, LIMIT = 4 * 1024 * 1024;
  var fileEl = $('mfile'), stat = $('mstat'), sEl = $('mstart'), lEl = $('mlen'), vEl = $('mvol'),

  var fmt = function (s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };

  function P() {
    return fixed || { start: +sEl.value, len: +lEl.value, vol: vEl.value / 100, fade: fadeEl.checked, loop: loopEl.checked };
  }
  function show() {
    sEl.nextElementSibling.textContent = fmt(sEl.value);
    lEl.nextElementSibling.textContent = lEl.value + ' с';
    vEl.nextElementSibling.textContent = vEl.value;
  }
  function ui() {
    pBtn.textContent = playing ? '⏸ Стоп' : '▶ Прослушать';
    cBtn.textContent = playing ? '♪ Выкл' : '♪ Музыка';

  }

  cBtn.addEventListener('click', function () { if (playing) stop(); else play(); });

  $('cardback').addEventListener('click', stop);
  document.addEventListener('keydown', function (e) {

    warm: warm,

    }
  };
  show(); ui();
})();
