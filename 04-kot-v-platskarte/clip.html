const K=[[0,[0,1.8,8.5],[0,1.3,-1]],[10,[0,1.5,5],[0,1.4,0]],[20,[-3,2.2,6],[0,1.3,0]],[25,[1,1.6,6],[2,1.5,0]],[31,[2,2.4,7.5],[1.5,1.6,0]],[37,[0,1.4,6.5],[0,1.3,0]],[41,[-.6,1.3,3.4],[-1.2,1.4,0]],[46,[1.5,1.6,5.5],[1,1.5,0]],[50,[0,2.6,9.5],[0,1.3,-1]],[55,[-.6,1.7,7],[-3.6,1,3]],[58,[-1.2,1.6,7.4],[-3.8,1,3]],[62,[-1.2,1.6,7.4],[-3.8,1,3]]];
const ss=u=>u*u*(3-2*u),mix=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u);

 const p=mix(a[1],b[1],u),l=mix(a[2],b[2],u);camera.position.set(p[0],p[1]+kick*.04,p[2]);camera.lookAt(l[0],l[1],l[2])}

// ---------- музыка: рок-группа на WebAudio
let ctx,master,NB,bus;
function tone(f,t,d,ty,v,dst){const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(dst||master);o.start(t);o.stop(t+d+.05)}
function noise(t,d,ty,f,v){const s=ctx.createBufferSource();s.buffer=NB;const fl=ctx.createBiquadFilter();fl.type=ty;fl.frequency.value=f;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(master);s.start(t);s.stop(t+d+.02)}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(master);o.start(t);o.stop(t+.35)}
function sched(t0){
 const comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);master=ctx.createGain();master.gain.value=1;master.connect(comp);
 NB=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ws=ctx.createWaveShaper(),cu=new Float32Array(512);for(let i=0;i<512;i++){const x=i/256-1;cu[i]=(3+80)*x*.35/(1+80*Math.abs(x)*.35)*1.2}ws.curve=cu;
 const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;const gg=ctx.createGain();gg.gain.value=.55;ws.connect(lp).connect(gg).connect(master);bus=ws;
 const ch=[[110,164.8,220],[87.3,130.8,174.6],[130.8,196,261.6],[98,146.8,196]];
 for(let bar=0;;bar++){const tb=T0+bar*4*BD;if(tb>59.6)break;const c=ch[bar%4],big=tb>=37.4,mid=tb>=20.4;
  for(let i=0;i<8;i++){const t=t0+tb+i*BD/2;
   if(i==0||i==4||(big&&i==7))kick(t);if(i==2||i==6)noise(t,.18,'bandpass',1900,mid?.9:.5);
   if(big||mid)noise(t,.05,'highpass',7500,.3);if(big&&i==0)noise(t,1.2,'highpass',5000,.35);
   if(big&&[0,1,3,4,5,7].includes(i))noise(t+.02,.04,'bandpass',1500,.35);
   if(!big){for(const f of c)tone(f,t,.14,'sawtooth',.22,bus)}else if(i%4==0){for(const f of c)tone(f,t,BD*1.9,'sawtooth',.2,bus)}
   tone(c[0]/2,t,.3,'sawtooth',.4)}}
 const t=t0+59.75;kick(t);for(const f of[110,164.8,220,329.6])tone(f,t,2,'sawtooth',.25,bus);noise(t,1.5,'highpass',5000,.5)}

function frame(t,dt){
 sm+=(env(t)-sm)*.5;const sc=t<20.4?1:t<37.4?2:t<50.2?3:4,kp=Math.pow(1-((((t-T0)%BD)+BD)%BD)/BD,3);

 camAt(t,kp);renderer.render(scene,camera);
